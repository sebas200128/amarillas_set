<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árbol de Flores Amarillas | En forma de Corazón</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">
  
  <!-- Google Fonts elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo sutil con grano/viñeta cálida -->
  <div class="ambient-glow"></div>

  <!-- PANTALLA INICIAL: Botón interactivo central -->
  <div id="start-screen" class="start-screen">
    <div class="start-card" id="start-btn" role="button" tabindex="0" aria-label="Haz clic para comenzar la animación">
      <div class="sunflower-btn-visual">
        <div class="sunflower-glow"></div>
        <!-- Girasol estilizado SVG -->
        <svg class="sunflower-svg" viewBox="0 0 120 120" width="110" height="110">
          <defs>
            <radialGradient id="petal-grad" cx="50%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#fff176" />
              <stop offset="50%" stop-color="#fbc02d" />
              <stop offset="100%" stop-color="#f57f17" />
            </radialGradient>
            <radialGradient id="center-grad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#5d4037" />
              <stop offset="65%" stop-color="#3e2723" />
              <stop offset="100%" stop-color="#1b0000" />
            </radialGradient>
            <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#cca020" flood-opacity="0.35"/>
            </filter>
          </defs>
          
          <!-- Hojas verdes de base -->
          <g class="sepals">
            <path d="M 60 60 L 38 78 Q 45 92 60 78 Z" fill="#4b7337" opacity="0.85"/>
            <path d="M 60 60 L 82 78 Q 75 92 60 78 Z" fill="#3c5e2b" opacity="0.85"/>
          </g>

          <!-- Pétalos exteriores -->
          <g class="petals-outer" filter="url(#soft-shadow)">
            <!-- 16 pétalos distribuidos uniformemente -->
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(0 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(22.5 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(45 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(67.5 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(90 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(112.5 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(135 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(157.5 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(180 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(202.5 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(225 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(247.5 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(270 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(292.5 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(315 60 60)"/>
            <path d="M 60 60 C 53 38, 54 15, 60 8 C 66 15, 67 38, 60 60 Z" fill="url(#petal-grad)" transform="rotate(337.5 60 60)"/>
          </g>

          <!-- Pétalos interiores intercalados -->
          <g class="petals-inner">
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(11.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(33.75 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(56.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(78.75 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(101.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(123.75 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(146.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(168.75 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(191.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(213.75 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(236.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(258.75 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(281.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(303.75 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(326.25 60 60)"/>
            <path d="M 60 60 C 55 42, 56 22, 60 16 C 64 22, 65 42, 60 60 Z" fill="#ffd54f" transform="rotate(348.75 60 60)"/>
          </g>

          <!-- Centro de la flor -->
          <circle cx="60" cy="60" r="23" fill="url(#center-grad)" />
          <circle cx="60" cy="60" r="22" fill="none" stroke="#d48b18" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8" />
          <circle cx="60" cy="60" r="16" fill="none" stroke="#ffb300" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
          <circle cx="60" cy="60" r="9" fill="#1b0000" />
        </svg>
      </div>

      <div class="start-btn-label">
        <span class="btn-text">Click Aquí</span>
        <span class="btn-subtext">Toca la flor para comenzar</span>
      </div>
    </div>
  </div>

  <!-- ESCENA PRINCIPAL: Canvas para el árbol, flores y pétalos -->
  <main class="main-scene">
    <canvas id="tree-canvas"></canvas>

    <!-- TARJETA CON MENSAJE DE AMOR (Lado Izquierdo) -->
    <section id="card-container" class="card-container" aria-live="polite">
      <div class="letter-card">
        <!-- Decoraciones de esquina sutiles -->
        <div class="card-corner top-left"></div>
        <div class="card-corner top-right"></div>
        <div class="card-corner bottom-left"></div>
        <div class="card-corner bottom-right"></div>

        <!-- Encabezado -->
        <header class="card-header">
          <h1 class="header-title">🌻 FELIZ DÍA DE LAS FLORES AMARILLAS 🌻</h1>
          <div class="title-underline"></div>
        </header>

        <!-- Mensaje central con máquina de escribir -->
        <article class="card-body">
          <div id="typewriter-text" class="typewriter-content">
            <!-- Inyectado progresivamente con JS -->
          </div>
        </article>

        <!-- Divisor decorativo -->
        <div class="card-divider">
          <span class="divider-line"></span>
          <span class="divider-icon">✦ 🌻 ✦</span>
          <span class="divider-line"></span>
        </div>

        <!-- Pie de página con frase cursiva -->
        <footer class="card-footer" id="card-footer">
          <p class="script-quote">
            "Eres el sol que hace florecer cada uno de mis días."
          </p>
          <div class="footer-mini-sunflower" title="🌻">
            <svg viewBox="0 0 40 40" width="28" height="28">
              <circle cx="20" cy="20" r="16" fill="#fbc02d" />
              <circle cx="20" cy="20" r="8" fill="#3e2723" />
            </svg>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <!-- CONTROLES FLOTANTES (Repetir y Sonido sutil) -->
  <div class="floating-controls">
    <button id="sound-btn" class="ctrl-btn" title="Activar/Desactivar sonido ambiental" aria-label="Sonido">
      <span class="ctrl-icon" id="sound-icon">🔈</span>
    </button>
    <button id="replay-btn" class="ctrl-btn hidden" title="Repetir animación" aria-label="Repetir animación">
      <span class="ctrl-icon">↺</span>
      <span class="ctrl-label">Repetir</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
